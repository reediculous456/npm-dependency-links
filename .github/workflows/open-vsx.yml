name: Publish to Open VSX

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm run check

      - name: Publish to Open VSX
        run: npm run publish:open-vsx -- --skip-duplicate --trusted-publishing
